services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_business_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-sbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbc} -d ${POSTGRES_DB:-service_business_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
